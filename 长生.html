<body>
人是贪心的动物，现世的爱让人难以餍足。
人道是，来生的红线自当来生月下牵。
他和她不愿，要在此生定了来日。
朝谒梧桐，夕参银杏。
东游西走，北起炊烟，南安卧榻。
春种秋收，夏四海求仙，冬百家问道。
终得一物，可契来生缠绵厮守，再不分离。
病来，她去。
他欲仙逝。
烛不尽。
染一咒。
长生。
